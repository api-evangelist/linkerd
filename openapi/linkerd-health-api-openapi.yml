openapi: 3.2.0
info:
  title: Linkerd Health API
  version: 2.x
  contact:
    name: Linkerd
    url: https://linkerd.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: 'Operations tagged Health across 2 of this provider''s published API definitions: linkerd-proxy-admin-openapi.yml, linkerd-viz-metrics-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:4191
  description: Linkerd proxy admin server (default port)
- url: http://metrics-api.linkerd-viz.svc.cluster.local:8085
  description: Linkerd Viz Metrics API service (in-cluster)
tags:
- name: Health
  description: Health and readiness check endpoints
paths:
  /ready:
    get:
      operationId: getProxyReadiness
      summary: Linkerd Proxy readiness check
      description: Returns the readiness status of the Linkerd proxy. Used by Kubernetes as a readiness probe to determine if the proxy is ready to accept traffic.
      tags:
      - Health
      responses:
        '200':
          description: Proxy is ready
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: Proxy is not ready
    servers:
    - url: http://localhost:4191
      description: Linkerd proxy admin server (default port)
  /live:
    get:
      operationId: getProxyLiveness
      summary: Linkerd Proxy liveness check
      description: Returns the liveness status of the Linkerd proxy. Used by Kubernetes as a liveness probe to determine if the proxy process is alive.
      tags:
      - Health
      responses:
        '200':
          description: Proxy is alive
          content:
            text/plain:
              schema:
                type: string
    servers:
    - url: http://localhost:4191
      description: Linkerd proxy admin server (default port)
x-refined-from:
- linkerd-proxy-admin-openapi.yml
- linkerd-viz-metrics-openapi.yml
